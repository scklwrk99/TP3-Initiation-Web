<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro Nova - Contact</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- En-tête avec logo et navigation -->
    <header>
        <div class="container">
            <!-- Logo cliquable -->
            <a href="../index.html" class="logo">Bistro Nova</a>
            <!-- Menu de navigation -->
            <nav>
                <a href="../index.html" class="nav-link">Accueil</a>
                <a href="apropos.html" class="nav-link">À propos</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Section contact principale -->
    <section class="contact-section">
        <div class="container">
            <!-- Titre de la page -->
            <h1 class="page-title"><span class="title-red">ADRESSE</span> ET HORAIRES</h1>
            
            <!-- Bloc adresse et horaires -->
            <div class="address-block">
                <h2>123 rue Principale, Montreal</h2>
                <ul class="hours-list">
                    <li>Lundi à Jeudi : 11h00 – 21h00</li>
                    <li>Vendredi et Samedi : 11h00 – 23h00</li>
                    <li>Dimanche : 12h00 – 20h00</li>
                </ul>
            </div>

            <!--Google Maps -->
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2796.207347165831!2d-73.57022908444238!3d45.50884597910138!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4cc91a450f95a0c9%3A0x4b1c9c2c5e7e8c2!2s123%20Rue%20Principale%2C%20Montr%C3%A9al%2C%20QC!5e0!3m2!1sfr!2sca!4v1234567890123!5m2!1sfr!2sca" 
                    width="100%" 
                    height="450" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <!-- Formulaire de réservation -->
            <h2 class="form-title">RÉSERVER VOTRE TABLE ICI</h2>
            <form id="reservationForm" class="reservation-form">
                <!-- Champ Nom -->
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input 
                        type="text" 
                        id="nom" 
                        name="nom" 
                        placeholder="Entrez votre nom"
                        required>
                </div>

                <!-- Champ Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Entrez votre adresse email"
                        required>
                </div>

                <!-- Champ Message -->
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        rows="5" 
                        placeholder="Entrez votre message"
                        required></textarea>
                </div>

                <!-- Bouton de soumission -->
                <button type="submit" class="btn btn-submit">Réserver maintenant</button>
            </form>
        </div>
    </section>

    <!-- Pied de page -->
    <footer>
        <div class="container">
            <h2 class="footer-logo">Bistro Nova</h2>
            <!-- Informations de contact -->
            <div class="footer-info">
                <p>123 rue Principale, Montreal</p>
                <p>(514) 123 - 4567</p>
                <p>info@bistronova.ca</p>
            </div>
        </div>
    </footer>

    <!-- Lien vers JavaScript -->
    <script src="../script.js"></script>
</body>
</html>
