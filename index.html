<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bistro Nova - Accueil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--En-tete avec logo et navigation-->
    <header>
        <div class="container">
            <a href="index.html" class="logo">Bistro Nova</a>
            
            <!--Menu de navigation-->
            <nav>
                <a href="index.html" class="nav-link active">Accueil</a>
                <a href="html/apropos.html" class="nav-link">À propos</a>
                <a href="html/contact.html" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <!--Section principale avec image de fond-->
    <section class="hero">
        <div class="hero-content">
            <h1>Savourez l'instant<br>chez Bistro Nova</h1>
            <!--Boutons-->
            <div class="hero-buttons">
                <a href="html/contact.html" class="btn btn-primary">Réserver une table</a>
                <a href="html/menu.html" class="btn btn-secondary">Voir le menu</a>
            </div>
        </div>
    </section>

    <!--Section des catégories de plats-->
    <section class="categories">
        <div class="container">
            <div class="category-grid">
                <!--Carte Burger-->
                <div class="category-card">
                    <img src="images/burger.jpg" alt="Burger">
                    <h3>Burger</h3>
                </div>

                <!--Carte Pizza-->
                <div class="category-card">
                    <img src="images/pizza.jpg" alt="Pizza">
                    <h3>Pizza</h3>
                </div>

                <!--Carte Pasta-->
                <div class="category-card">
                    <img src="images/pasta.jpg" alt="Pâtes">
                    <h3>Pasta</h3>
                </div>
            </div>
        </div>
    </section>

    <!--Pied de page-->
    <footer>
        <div class="container">
            <h2 class="footer-logo">Bistro Nova</h2>
            <!--Informations de contact-->
            <div class="footer-info">
                <p>123 rue Principale, Montreal</p>
                <p>(514) 123 - 4567</p>
                <p>info@bistronova.ca</p>
            </div>
        </div>
    </footer>
</body>
</html>
